[package]
name = "advanced-snes-rom-utility"
version = "2.1.0"
description = "Advanced SNES ROM Utility JS (Tauri)"
authors = ["Dom aka Doke"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "asru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small and fast release builds
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
