# Builds the Tauri version for Windows, macOS (Intel + Apple Silicon) and Linux.
#
# - Push to main/dev and pull requests: tests + builds, packages attached to the run
#   (Actions tab -> run -> "Artifacts").
# - Tag "v*" (f.e. v2.1.0): additionally creates a GitHub release with all packages.
# - "Run workflow" button in the Actions tab: manual build of any branch.

name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --bundles nsis
          - os: ubuntu-22.04
            name: linux
            args: --bundles deb,appimage
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Build packages
        run: npx tauri build ${{ matrix.args }}

      - name: Windows single EXE (no installation needed, uses the WebView2 of Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: cp "src-tauri/target/release/advanced-snes-rom-utility.exe" "src-tauri/target/release/bundle/nsis/Advanced SNES ROM Utility JS-Portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Advanced SNES ROM Utility JS ${{ github.ref_name }} (Tauri)
          generate_release_notes: true
          files: packages/*
